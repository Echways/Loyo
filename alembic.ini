[alembic]
# path to migration scripts
script_location = alembic
# file template for new revisions
# file_template = %%(rev)s_%%(slug)s
# sys.path manipulation hints:
# prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s

# Настройка подключения: используем переменную окружения DATABASE_URL.
# Перед запуском alembic экспортируй:
# export DATABASE_URL=postgresql+asyncpg://bot:secret@db:5432/botdb
sqlalchemy.url = %(DATABASE_URL)s

# Опции alembic (при желании изменить)
#timezone = utc
